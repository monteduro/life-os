[package]
name = "smart-notes-desktop"
version = "0.0.0"
description = "Smart Notes desktop shell"
authors = ["Stefano Monteduro"]
edition = "2021"

[lib]
name = "smart_notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"
